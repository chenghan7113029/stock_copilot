# 应用配置示例
# 复制为 config/app.yaml 后修改（app.yaml 已在 .gitignore）

app:
  name: stock_copilot
  env: development  # development | production
  debug: true

server:
  host: "0.0.0.0"
  port: 8000

logging:
  level: INFO
  dir: log
  filename: stock_copilot.log
  rotation: "1 day"
  retention: "30 days"
  cli_level: ERROR       # CLI stderr 日志级别（WARNING 在 PowerShell 下易被误判）
  cli_progress: true     # sync/report 向 stdout 打印阶段性进度

reports:
  dir: reports

# 数据库配置（SQLAlchemy engine URL）
# 切换 MySQL 只需修改 url，业务代码无需改动
db:
  url: "sqlite:///data/stock_copilot.db"  # 默认 SQLite
  # url: "mysql+pymysql://user:password@host:3306/stock_copilot"  # MySQL 示例
  echo: false  # true 时打印 SQL（仅用于调试）

# 数据源配置
# 数字越小越优先；未出现在 enabled 列表的源不会被实例化/调用
# 默认目标态（阶段 C）：tushare(1) + baostock(2)；AKShare 仅作紧急回滚可选源
data_sources:
  enabled:
    # Tushare Pro：需 Token（https://tushare.pro）；也可用环境变量 TUSHARE_TOKEN（勿把 token 提交 Git）
    - name: tushare
      priority: 1
      token: ""
    - name: baostock
      priority: 2
    # 紧急回滚：取消注释以临时启用 AKShare（不稳定，非默认路径）
    # - name: akshare
    #   priority: 3

# 价值面分析假设（Baostock FCF 推导 fallback 等）
value_analysis:
  fcf_rate: 0.85  # FCF/净利润比率 fallback（白酒等轻资产行业参考值）
  growth_rate_floor_by_proto:
    value_growth: 8.0
    high_dividend: 3.0
    bank: 5.0
    growth_manufacturing: 6.0
  beta_by_proto:
    value_growth: 0.6
    high_dividend: 0.5
    bank: 0.9
    growth_manufacturing: 0.8
  # 浅情景 DCF（P1 成长+制造）；百分数为增速点（12.0 = 12%）
  # scenario_dcf:
  #   defaults:
  #     bear: { growth_rate_1_5: 6.0, growth_rate_6_10: 3.0, terminal_growth: 1.5 }
  #     base: { growth_rate_1_5: 12.0, growth_rate_6_10: 5.0, terminal_growth: 2.0 }
  #     bull: { growth_rate_1_5: 18.0, growth_rate_6_10: 7.0, terminal_growth: 2.5 }
  #   by_code:
  #     "002594":
  #       base: { growth_rate_1_5: 14.0 }
  # 周期位置（P2）；缺省时可依赖 historical_pe 启发式；也可手工指定
  # cycle_position: bottom | early_up | mid | late | top | early_down
  # cyclical:
  #   by_code:
  #     "002027":
  #       cycle_position: mid
  #       normalized_eps: 0.45
  #       normalized_fcf: 4500000000
  # 军工订单（P3）；金额单位为元；缺 order_backlog/years 则诚实降级
  # defense_orders:
  #   discount_rate: 10.0
  #   by_code:
  #     "600072":
  #       order_backlog: 12000000000
  #       order_execution_years: 3.0
  #       order_margin: 12.0
  #       revaluation_assets: 500000000
  # 保险 EV/NBV（P4）；金额单位为元；缺 embedded_value 则诚实降级
  # insurance:
  #   p_ev_fair: 1.0
  #   by_code:
  #     "601318":
  #       embedded_value: 1200000000000
  #       nbv: 50000000000
  #       p_ev_fair: 0.9
  # MOS 阈值（按原型）：
  # - undervalued / mildly_undervalued / fair_low / mildly_overvalued 用于价值面五档 assessment
  # - overvalued 仅用于双轨 ValueRating（UNDERVALUED/FAIR/OVERVALUED）阈值
  mos_thresholds_by_proto:
    bank:
      undervalued: 12
      mildly_undervalued: 3
      fair_low: -3
      mildly_overvalued: -12
      overvalued: -12
    high_dividend:
      undervalued: 12
      mildly_undervalued: 3
      fair_low: -3
      mildly_overvalued: -12
      overvalued: -12
    value_growth:
      undervalued: 20
      mildly_undervalued: 5
      fair_low: -5
      mildly_overvalued: -20
      overvalued: -10

# LLM 叙事（OpenAI 兼容协议；api_key 勿提交到 Git）
# 优先级：llm.api_key > 环境变量 LLM_API_KEY；均未配置时 narrate() 返回 ok=False
# DeepSeek 示例（推荐）：
llm:
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  api_key: ""                               # 或使用环境变量 LLM_API_KEY
  max_evidence_chars: 24000                 # evidence 序列化超长截断阈值（约 8000 token）

# Feishu 研报推送（家里 PC 计划任务：`python -m apps.cli feishu push --watchlist --slot 0830`）
# 每票推送 confront + persona-stress 两篇文档（各一条消息）；正文经 lark-cli @file 上传
# 认证走本机 lark-cli（npx @larksuite/cli@latest install && lark-cli auth login），不在此填 Open API secret
feishu:
  lark_cli: "lark-cli"
  # 接收「一票一消息」：user_id（自聊 open_id）与 chat_id（群）二选一；同时配置时优先 user_id
  user_id: ""                 # 例：ou_xxx（lark-cli auth status / whoami）
  chat_id: ""                 # 例：oc_xxx
  folder_token: ""            # 新建云文档父文件夹 token（可选，对应 lark-cli --parent-token）
  sync_before_push: true
  trading_days_only: true
  holidays: []                # 休市日 ISO 日期，如 ["2026-10-01"]

# 外部参考仓库本地路径（只读查阅，不参与 import；整个 ref/ 目录不进 git）
ref:
  daily_stock_analysis: ref/daily_stock_analysis
  valueinvest: ref/valueinvest
  financetoolkit: ref/FinanceToolkit
