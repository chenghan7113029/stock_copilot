# CAN-IPS-001 投资目标函数（风险预算的硬线）
#
# 判别：Q1 不是一次性入参 / Q2 不是通用算法 / Q3 是「业务上什么算对」的硬标准，
#       且 Owner 不发版就能改、改完为结论负责 → 知识（口径层）
# 治理：2026-11-15 Owner 裁决「进 git，暂与固有逻辑一样用 git 管理」——
