#   滑点（按成交额分档）；CAN-COST-003 为过户费「单列」旧形态，已 deprecated，仅留档。
# 来源：Owner 2026-11-15 对 proposal Q4「费率表现值」的逐条答复 + 同日二次确认（经 captain 转交）。
# 判别（_design.md §0.0 四问）：Q3「业务上什么算对」+ 不发版就能改 + Owner 为结论负责 → 知识（canon）。
# 时效：费率/税率/过户费属「外部会变的口径」，按 _design.md §3.4 自然日时钟强制带 review_at。
