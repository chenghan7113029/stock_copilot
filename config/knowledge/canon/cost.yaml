      消费方不得同时按"佣金含过户费"与"过户费另计"两处扣费。
      观察名单（无 Scenario 断言）：消费点 = ⓐ Requirement R7
      （openspec/specs/backtest-engine/spec.md:145-151，要求每笔成交计入各成本分量）；
      R7 下 Scenario「单笔成交成本可分项复算」（同文件 :153-156）只断言四项金额可复算、隐含「不单列」，
      未断言「并入佣金 + 费率 0.001%」。连续 2 波无新增消费点 → 降 hypotheses；
      观察名单期间不得被实现当作强口径引用（须先补 spec Scenario）。
