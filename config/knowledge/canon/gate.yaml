  - id: CAN-GATE-001
    statement: >-
      三级门禁判据：「方向一致」= 与回测结果同号且年化收益差 ≤ 回测年化波动率的 50%；
      进入实盘的仓位上限 = 组合权益 10% 与单票 1% 取小；影子期按 CAN-GATE-002 的计时口径执行。
    layer: canon
    source: >-
      人工答复:Owner:2026-11-15:三级门禁判据（Q7）｜原话要点「影子期按 KQ-4（3 个月起 / 12 月封顶）；『方向一致』= 同号且年化差 ≤ 回测年化波动 50%；实盘上限 = 权益 10% 与单票 1% 取小」
    confidence: 确定
    owner: Owner
    strength: 硬规则
    frequency: 低
    lifecycle: active
    requirement_refs: [R19]
    as_of: "2026-11-15"
    notes: >-
      影子期时长与计时方式以 CAN-GATE-002 为准（Owner 在 Q7 里明确让影子期「按 KQ-4」），
      本条的 3 个月起 / 12 个月封顶只是转引，不重复定义。
      观察名单（无 Scenario 断言）：消费点 = ⓐ Requirement R19
      （openspec/specs/backtest-engine/spec.md:429-433）；R19 下 Scenario（同文件 :435-451）提及「方向一致判据」，
      未断言其定义（同号 + 年化差 ≤ 回测年化波动率 50%）与仓位上限（权益 10% / 单票 1% 取小）。
      连续 2 波无新增消费点 → 降 hypotheses；观察名单期间不得被实现当作强口径引用（须先补 spec Scenario）。
