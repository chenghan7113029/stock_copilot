      任何按「6 个月起」的判断都与本条冲突。
      冲突登记（2026-11-15，K1b 回溯核对；本波不改任何一侧数值）：主规格
      `openspec/specs/backtest-engine/spec.md:431`（R19 正文「记录 6–12 个月实际表现」）与
      `openspec/specs/backtest-engine/spec.md:443`（Scenario「影子期未满不得启用实盘」→「提示最低 6 个月」）与本条「3 个月起」冲突。
