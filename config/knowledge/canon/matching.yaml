    strength: 硬规则
    frequency: 低
    lifecycle: active
    requirement_refs: [R8]
    as_of: "2026-11-15"
    notes: >-
      「滑点加倍」= 在该笔按成交额所属档位（见 CAN-COST-004）算出的滑点上翻倍；
      不得改成固定 bps，也不得与「一字板不可成交」（CAN-MATCH-001）混用。
      观察名单（无 Scenario 断言）：消费点 = ⓐ Requirement R8
      （openspec/specs/backtest-engine/spec.md:175-179）；R8 下 Scenario（同文件 :181-201）覆盖一字板顺延 /
      跌停 / T+1 / 停牌，未断言「收盘封板但盘中打开 → 可成交 + 滑点加倍」分支。连续 2 波无新增消费点 →
      降 hypotheses；观察名单期间不得被实现当作强口径引用（须先补 spec Scenario）。
