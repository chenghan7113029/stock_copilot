      当日收盘封板、但盘中曾打开的标的可成交，且该笔滑点按对应档位加倍计算。
    layer: canon
    source: >-
      人工答复:Owner:2026-11-15:撮合与停牌口径（Q5）｜原话要点「收盘封板但盘中打开 → 可成交 + 滑点加倍」
