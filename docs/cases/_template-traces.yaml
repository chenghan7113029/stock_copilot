# Case 溯源区（traces.yaml）— append-only，QA（K3 / T5）唯一写者
#
# 位置：docs/cases/<case-id>/traces.yaml（本文件是模板：复制一份到 case 目录，再改成自己的记录）
# 作用：记录「验了哪条结论的哪一层、结论是什么」。
#       「复现进度」表由本文件按 conclusion × layer 取最新 verdict 派生，不手写。
#
# 铁律：能引用的一律不转述 —— 命令输出、数字、verdict 照抄实际输出，
#       不得凭记忆重写、不得从旧记录复制。annotations.md 里不抄这些，
#       只写「结论编号 + 见 traces.yaml」。
#
# 字段（只有这 8 个；本仓库没有独立运行产物目录，也没有查询 id 这类东西）：
#   id          必填，唯一，形如 20261114-add-foo-01（日期 + change 名 + 两位序号）
#   date        必填，ISO8601 带时区，如 2026-11-14T13:33:03+08:00
#   kind        必填，reproduction（case 回归）| exploration（机制探索，如判异实验、参数扫描）
#   conclusion  必填，结论编号，与 annotations.md 对齐（C1、C2…）
#   layer       必填，function（能力层能否做）| number（数字是否对上）| knowledge（知识是否对）
#   verdict     必填，pass | partial | fail；未达锚点时 verdict=partial|fail，
#               并在 note 写清卡点（功能 / 知识 / 数据源）
#   evidence    必填，命令 + 退出码 + 关键输出，或 `文件:行` / 测试节点 id；
#               「查出 0 条」与「真实为 0」必须能区分（写清命令与输出）
#   note        可选，一句话导读，不替代 evidence
#
# 空表形态（追加时把下面的 [] 换成列表，或在列表末尾继续 - 追加）：

[]
