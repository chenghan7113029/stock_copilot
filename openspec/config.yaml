schema: spec-driven

context: |
  项目：stock_copilot — 股票分析编排层，整合技术面、价值面与 LLM 综合决策。

  工程约定唯一真源：docs/dev/engineering-conventions.md（含架构、目录、依赖、LLM 规范）
  LLM 质量规范：docs/agent-engineering-quality.md
  AI 入口：AGENTS.md

  目录结构：
  - docs/mrd/          — 市场需求文档（权威，归档后须合并）
  - docs/design/       — 专项设计文档（不含重复架构）
  - docs/dev/engineering-conventions.md — 工程约定与架构（唯一真源）
  - src/               — 源代码（扁平）
    - apps/            — CLI / 交互入口
    - controller/      — API 接口层
    - service/         — 业务服务
    - data_provider/   — 外部数据 API
    - dao/             — 数据库访问
    - common/          — 通用模块
  - test/              — 测试
  - config/            — 配置
  - scripts/           — 脚本
  - log/               — 日志
  - reports/           — 分析报告产出（gitignore）
  - ref/               — 外部参考 clone（gitignore，只读，禁止 import）

  技术栈：Python 3.10+、FastAPI（规划）、YAML 配置、pytest（importlib 模式）、
          SQLAlchemy + SQLite（db.url 可配置切换 MySQL）、
          akshare >= 1.18.54、baostock >= 0.9.2。

  架构原则：
  - 依赖方向：apps → controller → service → data_provider/dao → common
  - ref/ 下 clone 仅作参考；需要逻辑时拷贝进 src/，禁止 import
  - 确定性计算与 LLM 分离（三层防御，见 agent-engineering-quality.md）
  - OpenSpec 归档后合并 proposal/specs/design 到 docs/mrd 与 docs/design

  完成判定（硬约束，全局）：
  - tasks.md 勾选完成 ≠ change / apply / archive 完成。
  - 相关测试未实际跑通前，不得声称「实现完成」「spec 完成」或默认执行归档。
  - 默认门禁：本 change 新增/修改的用例 + `pytest -q -m "not network"`（以及 tasks/spec 声明的额外门禁，如 L3 `compare_migration_baseline.py`）必须执行并确认通过；须保留可核对的命令输出。
  - 禁止以「既有无关失败」「大致够了」「稍后补测」默认放行。
  - 仅当 Owner 在对话中显式豁免某失败项时，才可带豁免记录继续（tasks/PR 须写明豁免项与原因）。

rules:
  proposal:
    - 说明影响的 src 模块（apps/controller/service 等）
    - 标注需更新的 docs/mrd 或 docs/design 文件
    - 架构/目录变更须更新 docs/dev/engineering-conventions.md
  specs:
    - 用 Given/When/Then 描述场景
    - 区分确定性输出与 LLM 输入字段
  design:
    - 明确模块边界与依赖方向，符合 docs/dev/engineering-conventions.md
    - 文件路径使用 src/<module>/ 格式
  tasks:
    - 每步对应具体文件路径（Create / Modify / Test）
    - 含测试步骤（test/ 目录）；验证 task 须写明具体命令（如 pytest 路径或脚本）
    - 测试未通过时不得将对应 checkbox 勾为完成；不得把「有失败但仍归档」写成默认路径
    - 归档 task 包含「合并文档到 docs/mrd 或 docs/design」与「验证门禁已通过（或 Owner 显式豁免）」
