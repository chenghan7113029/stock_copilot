schema: spec-driven

context: |
  项目：stock_copilot — 股票分析编排层，整合技术面、价值面与 LLM 综合决策。

  工程约定唯一真源：docs/dev/engineering-conventions.md（含架构、目录、依赖、LLM 规范）
  LLM 质量规范：docs/agent-engineering-quality.md
  AI 入口：AGENTS.md

  目录结构：
  - docs/mrd/          — 市场需求文档（权威，归档后须合并）
  - docs/design/       — 专项设计文档（不含重复架构）
  - docs/dev/engineering-conventions.md — 工程约定与架构（唯一真源）
  - src/               — 源代码（扁平）
    - apps/            — CLI / 交互入口
    - controller/      — API 接口层
    - service/         — 业务服务
    - data_provider/   — 外部数据 API
    - dao/             — 数据库访问
    - common/          — 通用模块
  - test/              — 测试
  - config/            — 配置
  - scripts/           — 脚本
  - log/               — 日志
  - reports/           — 分析报告产出（gitignore）
  - ref/               — 外部参考 clone（gitignore，只读，禁止 import）

  协作流程（角色、波次 DAG、闸门、人工检查点）见 docs/agent-team/PLAYBOOK.md；
  角色 instruction 在 docs/agent-team/roles/，产物模板在 docs/agent-team/templates/，
  环境事实（实测）在 docs/agent-team/ENV.md。
  知识层在 config/knowledge/（口径 / 规则 / 判例 / 映射，每条带来源 + 置信度 + owner）；
  知识蒸馏全部人工咨询（本机没有可蒸馏的飞书机器人 / 飞书号，禁止自动抓取）。
  团队自检脚本（起波与收口必跑）：scripts/agent_team_models.py、agent_team_preflight.py、
  agent_team_plan.py、check_knowledge_source.py；未安装的脚本不得写进闸门。
  需求基线在 docs/mrd/（mrd-v{N}.md 为流水线基线，锚点形如 MRD-3.2；product-overview.md 与 features/ 为细目）；
  改进点台账在 docs/improvements/IMPROVEMENTS.md。
  代码目录结构见 docs/architecture/STRUCTURE.md。
  硬规则：openspec/specs/ 只能由 openspec archive 合并 delta 写入，任何角色禁止手改。
  产物语言：正文 zh-CN；## ADDED Requirements / SHALL / MUST / #### Scenario 等结构标记保留英文。

  技术栈：Python 3.10+、FastAPI（规划）、YAML 配置、pytest（importlib 模式）、
          SQLAlchemy + SQLite（db.url 可配置切换 MySQL）、
          akshare >= 1.18.54、baostock >= 0.9.2。

  架构原则：
  - 依赖方向：apps → controller → service → data_provider/dao → common
  - ref/ 下 clone 仅作参考；需要逻辑时拷贝进 src/，禁止 import
  - 确定性计算与 LLM 分离（三层防御，见 agent-engineering-quality.md）
  - OpenSpec 归档后合并 proposal/specs/design 到 docs/mrd 与 docs/design

  完成判定（硬约束，全局）：
  - tasks.md 勾选完成 ≠ change / apply / archive 完成。
  - 相关测试未实际跑通前，不得声称「实现完成」「spec 完成」或默认执行归档。
  - 默认门禁：本 change 新增/修改的用例 + `pytest -q -m "not network"`（以及 tasks/spec 声明的额外门禁，如 L3 `compare_migration_baseline.py`）必须执行并确认通过；须保留可核对的命令输出。
  - 禁止以「既有无关失败」「大致够了」「稍后补测」默认放行。
  - 仅当 Owner 在对话中显式豁免某失败项时，才可带豁免记录继续（tasks/PR 须写明豁免项与原因）。

rules:
  proposal:
    - 说明影响的 src 模块（apps/controller/service 等）
    - 标注需更新的 docs/mrd 或 docs/design 文件
    - 架构/目录变更须更新 docs/dev/engineering-conventions.md
    - 每条需求必须标注 MRD 溯源锚点（形如 MRD-3.2），锚点须能在 docs/mrd/ 中查到。
    - Why 至少 50 字，说明为什么现在做、不做会怎样。
    - Capabilities 段必须列出本次新增或修改的 capability 路径。
    - 必须写明本波不做什么（out of scope），防止范围蔓延。
  specs:
    - 用 Given/When/Then 描述场景
    - 区分确定性输出与 LLM 输入字段
    - 每个 Requirement 用 SHALL 描述一条可观测行为，一条 Requirement 只表达一个行为。
    - 每个 Requirement 至少一个 #### Scenario，且同时含 WHEN 与 THEN。
    - 用 ADDED / MODIFIED / REMOVED Requirements 表达增量，不要整篇复制现有规格。
    - Scenario 必须可被测试覆盖，避免「用户体验良好」这类不可判定表述。
  design:
    - 明确模块边界与依赖方向，符合 docs/dev/engineering-conventions.md
    - 文件路径使用 src/<module>/ 格式
    - 必须记录至少一个被否方案及否掉的理由。
    - 影响面必须给出具体文件路径清单，不要写「相关模块」；路径遵循 docs/architecture/STRUCTURE.md 的分层（apps/controller/service/data_provider/dao/common）。
    - 风险表需含风险、触发条件、缓解措施、回滚方式。
    - 方案定稿后实现不得擅自偏离；需要偏离时回到 design 修订，不得在代码里偷偷改设计。
  tasks:
    - 每步对应具体文件路径（Create / Modify / Test）    - 含测试步骤（test/ 目录）；验证 task 须写明具体命令（如 pytest 路径或脚本）
    - 测试未通过时不得将对应 checkbox 勾为完成；不得把「有失败但仍归档」写成默认路径
    - 归档 task 包含「合并文档到 docs/mrd 或 docs/design」与「验证门禁已通过（或 Owner 显式豁免）」
    - 每条任务必须能在验证阶段判定真伪，尽量附上可执行命令（真实可跑，不写「跑一下测试」）。
    - 任务粒度控制在一次可提交的范围，避免「完成整个模块」这种无法验收的条目。
    - 勾选前必须先真实跑通对应命令，证据写进 verification.md。

  knowledge:
    - 知识条目必须带 source / confidence / owner / strength / frequency / lifecycle；无来源不入库。
    - 知识只能来自 ① 人工答复（经 captain 转交，1 小时无答复即标未解决）② 仓库内一手材料；禁止自动抓取与飞书机器人。
    - confidence 只有 确定 / 假设 / 未知：人工明确答复与一手材料原文可标确定；推断、ref/ 快照、外部资料只能标假设。
    - 口径与业务规则不得凭空写进 config/knowledge/；采不到就记进 known_unknowns.yaml（知识负债）。
    - 分层（哪一层、schema 字段、升降级与退役规则）由 knowledge-architect 写进 config/knowledge/_design.md，knowledge-engineer 不得越层。

operations:
  apply:
    guidance:
      - 先运行验证命令，再勾选 checkbox；不得先勾选后补证据。
      - 不得修改 openspec/specs/（主规格只由 archive 更新）。
      - 不得修改 design.md 以迁就实现；发现方案不可行应停下并报告。
      - 不得为了让测试通过而放宽断言或删除用例。
  archive:
    guidance:
      - 归档前确认 tasks.md 全部勾选、verification.md 已存在、review.md 的 verdict 为 pass。
      - 归档后修正 openspec/specs/<capability>/spec.md 里 Purpose 的 TBD 占位，并确保其不少于 50 个字符，否则 validate --specs 判 failed。
      - 归档后运行 openspec validate --specs --strict 与 openspec doctor 确认仓库健康。
      - 归档提交信息需引用 change 名，便于回溯。
